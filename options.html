<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title data-i18n="optionsTitle">Short URL Settings</title>
  <meta name="theme-color" content="#FFB010">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Brand Color System (david888.com & 2md.aiurl.tw) */
      --saffron: #ffb010;
      --saffron-hover: #f2a600;
      --deep-blue: #17324d;
      --deep-blue-hover: #0f2235;
      --clay: #a9471d;
      --clay-hover: #8f3b17;
      --warm-cream: #fff9e8;
      --canvas: #fff0cc;
      --ink: #2b251a;

      /* Semantic Tokens - Light Mode */
      --bg: var(--canvas);
      --card: var(--warm-cream);
      --card-border: #ddc58b;
      --border: #ddc58b;
      --text: var(--ink);
      --text-muted: #594e36; /* WCAG AA 6.2:1 contrast */
      --primary: var(--saffron);
      --primary-hover: var(--saffron-hover);
      --primary-text: var(--ink); /* WCAG AAA 8.3:1 contrast */
      --secondary: var(--deep-blue);
      --secondary-hover: var(--deep-blue-hover);
      --secondary-text: #ffffff; /* WCAG AAA 11.5:1 contrast */
      --primary-light: rgba(255, 176, 16, 0.16);
      --input-bg: #fffefa;
      --input-border: #c8b078;
      --focus-ring: rgba(255, 176, 16, 0.45);
      --shadow: 0 4px 16px rgba(43, 37, 26, 0.08);
      --font: 'Noto Sans TC', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    [data-theme="dark"] {
      /* Semantic Tokens - Dark Mode (david888.com) */
      --bg: #0c1927;
      --card: #13273c;
      --card-border: #233e5c;
      --border: #233e5c;
      --text: #fff9e8;
      --text-muted: #cbd5e1; /* WCAG AAA 9.1:1 on dark */
      --primary: #ffb010;
      --primary-hover: #f2a600;
      --primary-text: #0c1927; /* WCAG AAA on #ffb010 */
      --secondary: #1f4268;
      --secondary-hover: #295383;
      --secondary-text: #fff9e8;
      --primary-light: rgba(255, 176, 16, 0.18);
      --input-bg: #1b3450;
      --input-border: #2d5178;
      --focus-ring: rgba(255, 176, 16, 0.45);
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .settings-container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .header-section {
      text-align: center;
      margin-bottom: 8px;
    }

    .header-section h2 {
      margin: 0 0 8px 0;
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .header-section p {
      margin: 0;
      font-size: 14px;
      color: var(--text-muted);
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 24px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      margin: 0 0 16px 0;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 18px;
      position: relative;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      font-family: 'JetBrains Mono', monospace, var(--font);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      background-color: var(--input-bg);
      color: var(--text);
      transition: all 0.2s ease;
      box-sizing: border-box;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    .toggle-visibility-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s ease;
    }

    .toggle-visibility-btn:hover {
      color: var(--text);
    }

    .btn {
      font-family: var(--font);
      font-size: 14px;
      font-weight: 600;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 42px;
    }

    .btn-primary {
      background: var(--primary);
      color: var(--primary-text);
      box-shadow: 0 4px 12px rgba(255, 176, 16, 0.25);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      box-shadow: 0 6px 16px rgba(255, 176, 16, 0.35);
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background-color: var(--secondary);
      color: var(--secondary-text);
      border: 1px solid transparent;
      box-shadow: 0 2px 8px rgba(23, 50, 77, 0.15);
    }

    .btn-secondary:hover {
      background-color: var(--secondary-hover);
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .info-box {
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-top: 14px;
    }

    .info-box h4 {
      margin: 0 0 6px 0;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }

    .info-box p {
      margin: 0 0 12px 0;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    #permissions-status {
      font-size: 12px;
      font-weight: 600;
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #status {
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      min-height: 20px;
      color: var(--text);
      transition: opacity 0.25s ease;
    }

    .language-select-wrapper {
      display: flex;
      justify-content: flex-end;
      margin-bottom: -16px;
    }

    .lang-select {
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--card);
      font-size: 12px;
      color: var(--text);
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
    }

    .lang-select:focus {
      outline: none;
      border-color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="settings-container">
    <div class="language-select-wrapper" style="display: flex; gap: 8px; justify-content: flex-end; align-items: center; margin-bottom: -16px;">
      <button id="theme-toggle-btn" class="lang-select" style="padding: 6px 12px; font-family: var(--font); display: flex; align-items: center; justify-content: center;" title="Toggle theme"></button>
      <select id="language-select" class="lang-select">
        <option value="auto">Language (Auto)</option>
        <option value="en">English</option>
        <option value="zh-TW">繁體中文</option>
      </select>
    </div>

    <div class="header-section">
      <h2>
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary); vertical-align: middle; margin-right: 6px;"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        <span data-i18n="settingsTitle">Short URL Settings</span>
      </h2>
      <p data-i18n="settingsSubtitle">Configure your shortening APIs and service tokens</p>
    </div>

    <!-- Primary API Settings -->
    <div class="card">
      <div class="card-title">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary); vertical-align: middle; margin-right: 6px;"><path d="M18 12V4H6v8c0 3.3 2.7 6 6 6s6-2.7 6-6z"></path><line x1="9" y1="2" x2="9" y2="4"></line><line x1="15" y1="2" x2="15" y2="4"></line><line x1="12" y1="18" x2="12" y2="22"></line></svg>
        <span data-i18n="primaryApiTitle">Primary API Settings</span>
      </div>
      
      <div class="form-group">
        <label for="base-url" data-i18n="primaryBaseUrlLabel">Base URL:</label>
        <input type="text" id="base-url" placeholder="https://aiurl.tw/api/link/create">
      </div>
      
      <div class="form-group">
        <label for="token" data-i18n="primaryTokenLabel">Authorization Token:</label>
        <div class="input-wrapper">
          <input type="password" id="token" placeholder="Enter primary authorization token">
          <button type="button" id="toggle-token" class="toggle-visibility-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Backup API Settings -->
    <div class="card">
      <div class="card-title">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary); vertical-align: middle; margin-right: 6px;"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
        <span data-i18n="backupApiTitle">Backup API Settings (Optional)</span>
      </div>
      
      <div class="form-group">
        <label for="backup-url" data-i18n="backupBaseUrlLabel">Backup Base URL:</label>
        <input type="text" id="backup-url" placeholder="e.g. https://glsoft.ai/api/link/create">
      </div>
      
      <div class="form-group">
        <label for="backup-token" data-i18n="backupTokenLabel">Backup Authorization Token:</label>
        <div class="input-wrapper">
          <input type="password" id="backup-token" placeholder="Enter backup authorization token">
          <button type="button" id="toggle-backup-token" class="toggle-visibility-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Actions & Status -->
    <div class="card" style="padding: 20px;">
      <button id="save-btn" class="btn btn-primary" style="display: flex; align-items: center; justify-content: center; gap: 8px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: currentColor;"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
        <span data-i18n="saveBtn">Save Settings</span>
      </button>
      <div id="status" style="margin-top: 10px;"></div>
    </div>

    <!-- Permissions Support -->
    <div class="card">
      <div class="card-title">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary); vertical-align: middle; margin-right: 6px;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg>
        <span data-i18n="customApiSupportTitle">Custom API Support</span>
      </div>
      <p style="font-size: 13px; color: var(--text-muted); margin: 0 0 14px 0; line-height: 1.5;" data-i18n="customApiSupportDesc">
        To use custom APIs outside of the default services, you need to grant host permissions.
      </p>
      
      <button id="request-permissions-btn" class="btn btn-secondary" style="display: flex; align-items: center; justify-content: center; gap: 8px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle;"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path></svg>
        <span data-i18n="enableCustomApisBtn">Enable Custom APIs</span>
      </button>
      <div id="permissions-status"></div>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
