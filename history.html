<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title data-i18n="historyTitle">URL History - Short URL Extension</title>
  <meta name="theme-color" content="#FFB010">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Brand Color System (david888.com & 2md.aiurl.tw) */
      --saffron: #ffb010;
      --saffron-hover: #f2a600;
      --deep-blue: #17324d;
      --deep-blue-hover: #0f2235;
      --clay: #a9471d;
      --clay-hover: #8f3b17;
      --warm-cream: #fff9e8;
      --canvas: #fff0cc;
      --ink: #2b251a;

      /* Semantic Tokens - Light Mode */
      --bg: var(--canvas);
      --card: var(--warm-cream);
      --card-border: #ddc58b;
      --border: #ddc58b;
      --text: var(--ink);
      --text-muted: #594e36; /* WCAG AA 6.2:1 contrast */
      --primary: var(--saffron);
      --primary-hover: var(--saffron-hover);
      --primary-text: var(--ink); /* WCAG AAA 8.3:1 contrast */
      --secondary: var(--deep-blue);
      --secondary-hover: var(--deep-blue-hover);
      --secondary-text: #ffffff; /* WCAG AAA 11.5:1 contrast */
      --danger: var(--clay);
      --danger-hover: var(--clay-hover);
      --danger-text: #ffffff; /* WCAG AA 5.8:1 contrast */

      --input-bg: #fffefa;
      --input-border: #c8b078;
      --pill-bg: #fff4d6;
      --focus-ring: rgba(255, 176, 16, 0.45);
      --shadow: 0 4px 16px rgba(43, 37, 26, 0.08);
      --font: 'Noto Sans TC', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    [data-theme="dark"] {
      /* Semantic Tokens - Dark Mode (david888.com) */
      --bg: #0c1927;
      --card: #13273c;
      --card-border: #233e5c;
      --border: #233e5c;
      --text: #fff9e8;
      --text-muted: #cbd5e1; /* WCAG AAA 9.1:1 on dark */
      --primary: #ffb010;
      --primary-hover: #f2a600;
      --primary-text: #0c1927; /* WCAG AAA on #ffb010 */
      --secondary: #1f4268;
      --secondary-hover: #295383;
      --secondary-text: #fff9e8;
      --danger: #cf5c2a;
      --danger-hover: #b84a1d;
      --danger-text: #ffffff;

      --input-bg: #1b3450;
      --input-border: #2d5178;
      --pill-bg: #172d45;
      --focus-ring: rgba(255, 176, 16, 0.45);
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 40px 20px;
      min-height: 100vh;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
    }
    
    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    
    .header {
      background: linear-gradient(135deg, #17324d 0%, #0d1e30 100%);
      color: #fff9e8;
      padding: 28px 32px;
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(23, 50, 77, 0.35);
      border: 1px solid rgba(255, 176, 16, 0.25);
      position: relative;
      overflow: hidden;
    }

    [data-theme="dark"] .header {
      background: linear-gradient(135deg, #13273c 0%, #0a1624 100%);
      border-color: rgba(255, 176, 16, 0.35);
    }

    .header::after {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(255, 176, 16, 0.08) 0%, transparent 70%);
      border-radius: 50%;
      top: -100px;
      right: -100px;
      pointer-events: none;
    }
    
    .header h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff9e8;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .header p {
      margin: 8px 0 0 0;
      opacity: 0.92;
      font-size: 14px;
      line-height: 1.5;
      color: #cbd5e1;
    }
    
    .controls {
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    
    .stats {
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .actions {
      display: flex;
      gap: 8px;
    }
    
    .btn {
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
      font-family: var(--font);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 36px;
    }
    
    .btn-primary {
      background-color: var(--secondary);
      color: var(--secondary-text);
      box-shadow: 0 2px 8px rgba(23, 50, 77, 0.2);
    }
    
    .btn-primary:hover {
      background-color: var(--secondary-hover);
      transform: translateY(-1px);
    }
    
    .btn-danger {
      background-color: var(--danger);
      color: var(--danger-text);
      box-shadow: 0 2px 8px rgba(169, 71, 29, 0.2);
    }
    
    .btn-danger:hover {
      background-color: var(--danger-hover);
      transform: translateY(-1px);
    }
    
    .search-box {
      width: 240px;
      padding: 8px 12px;
      border: 1px solid var(--input-border);
      border-radius: 8px;
      font-size: 14px;
      font-family: var(--font);
      transition: all 0.2s ease;
      background-color: var(--input-bg);
      color: var(--text);
    }
    
    .search-box:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }
    
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    .history-item {
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 20px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    
    .history-item:hover {
      border-color: var(--primary);
    }
    
    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }
    
    .item-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      margin: 0;
      flex: 1;
      margin-right: 15px;
      letter-spacing: -0.01em;
    }
    
    .item-date {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      font-weight: 500;
    }
    
    .history-stats {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .item-urls {
      display: grid;
      grid-template-columns: 80px 1fr auto;
      gap: 12px;
      align-items: center;
      margin-bottom: 8px;
      background: var(--pill-bg);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .item-urls:last-of-type {
      margin-bottom: 12px;
    }
    
    .url-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    
    .url-link {
      color: var(--secondary);
      text-decoration: none;
      word-break: break-all;
      font-size: 13px;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
    }

    [data-theme="dark"] .url-link {
      color: var(--primary);
    }
    
    .url-link:hover {
      text-decoration: underline;
    }
    
    .copy-btn-small {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: var(--font);
    }
    
    .copy-btn-small:hover {
      background: var(--bg);
      border-color: var(--primary);
    }
    
    .copy-btn-small.copied {
      background: var(--primary);
      color: var(--primary-text);
      border-color: var(--primary);
    }
    
    .action-buttons {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }
    
    .action-btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: var(--font);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    
    .action-btn.edit:hover {
      background: var(--primary);
      color: var(--primary-text);
      border-color: var(--primary);
    }
    
    .action-btn.delete:hover {
      background: var(--danger);
      color: var(--danger-text);
      border-color: var(--danger);
    }
    
    .edit-form {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-top: 14px;
      display: none;
    }
    
    .edit-form.show {
      display: block;
    }
    
    .edit-input {
      width: 100%;
      padding: 8px 12px;
      margin-bottom: 10px;
      border: 1px solid var(--input-border);
      border-radius: 8px;
      font-size: 13px;
      font-family: var(--font);
      box-sizing: border-box;
      background-color: var(--input-bg);
      color: var(--text);
    }

    .edit-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }
    
    .edit-buttons {
      display: flex;
      gap: 8px;
    }
    
    .edit-btn {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: var(--font);
    }
    
    .edit-btn.save {
      background: var(--primary);
      color: var(--primary-text);
    }
    
    .edit-btn.save:hover {
      background: var(--primary-hover);
    }
    
    .edit-btn.cancel {
      background: var(--pill-bg);
      color: var(--text);
      border: 1px solid var(--border);
    }
    
    .edit-btn.cancel:hover {
      border-color: var(--primary);
    }
    
    .empty-state {
      text-align: center;
      padding: 60px 24px;
      color: var(--text-muted);
      background: var(--card);
      border-radius: 20px;
      border: 1px dashed var(--border);
      box-shadow: var(--shadow);
    }
    
    .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .empty-state h3 {
      margin: 0 0 8px 0;
      color: var(--text);
      font-weight: 700;
      font-size: 18px;
    }

    .empty-state p {
      margin: 0;
      font-size: 14px;
    }
    
    .back-link {
      position: fixed;
      top: 24px;
      left: 24px;
      background: var(--card);
      color: var(--secondary);
      padding: 8px 14px;
      border-radius: 8px;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(43, 37, 26, 0.08);
      border: 1px solid var(--border);
      font-weight: 600;
      font-size: 13px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 100;
    }

    [data-theme="dark"] .back-link {
      color: var(--primary);
    }
    
    .back-link:hover {
      background: var(--primary);
      color: var(--primary-text);
      border-color: var(--primary);
      transform: translateY(-1px);
    }
    
    .hidden {
      display: none !important;
    }

    .tag-info {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
      background: var(--pill-bg);
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <a href="#" id="back-link" class="back-link">← <span data-i18n="backLink">Back to Extension</span></a>
  <button id="theme-toggle-btn" class="back-link" style="left: auto; right: 24px; display: flex; align-items: center; justify-content: center;" title="Toggle theme"></button>
  
  <div class="container">
    <div class="header">
      <h1>
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary); vertical-align: middle;"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
        <span data-i18n="historyTitleHeader">URL History</span>
      </h1>
      <p data-i18n="historySubtitle">Complete history of all your shortened URLs</p>
      <p style="font-size: 12px; color: var(--primary); opacity: 0.95; margin: 8px 0 0 0;" data-i18n="historyHint">💡 Press F5 or click "Refresh All" to reload new URLs and statistics</p>
    </div>
    
    <div class="controls">
      <div class="stats">
        <span id="total-count">0 URLs</span> • 
        <span id="storage-info">Loading...</span>
      </div>
      
      <input type="text" id="search-box" class="search-box" placeholder="Search URLs or titles..." data-i18n-placeholder="searchPlaceholder">
      
      <div class="actions">
        <button id="refresh-stats-btn" class="btn btn-primary" style="display: inline-flex; align-items: center; gap: 6px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path></svg>
          <span data-i18n="refreshBtn">Refresh All</span>
        </button>
        <button id="export-btn" class="btn btn-primary" style="display: inline-flex; align-items: center; gap: 6px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          <span data-i18n="exportBtn">Export</span>
        </button>
        <button id="clear-all-btn" class="btn btn-danger" style="display: inline-flex; align-items: center; gap: 6px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
          <span data-i18n="clearAllBtn">Clear All</span>
        </button>
      </div>
    </div>
    
    <div id="history-container" class="history-list">
      <!-- History items will be loaded here -->
    </div>
    
    <div id="empty-state" class="empty-state hidden">
      <div class="empty-icon">📝</div>
      <h3 data-i18n="emptyTitle">No URLs shortened yet</h3>
      <p data-i18n="emptyDesc">Start shortening URLs to see them appear here!</p>
    </div>
  </div>
  
  <script src="utils.js"></script>
  <script src="history.js"></script>
</body>
</html>
