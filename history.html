<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title data-i18n="historyTitle">URL History - Short URL Extension</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #15a34a;
      --primary-hover: #16a34a;
      --primary-light: rgba(21, 163, 74, 0.08);
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --focus-ring: rgba(21, 163, 74, 0.2);
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05), 0 10px 15px -3px rgb(0 0 0 / 0.05);
      --font: 'Geist', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --input-bg: #ffffff;
    }

    [data-theme="dark"] {
      --bg: #090d16;
      --card: #151f32;
      --text: #f1f5f9;
      --text-muted: #8292aa;
      --border: #243555;
      --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.35);
      --focus-ring: rgba(21, 163, 74, 0.4);
      --primary-light: rgba(21, 163, 74, 0.15);
      --input-bg: #0d1525;
    }

    body {
      font-family: var(--font);
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 40px 20px;
      min-height: 100vh;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
    }
    
    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    
    .header {
      background: linear-gradient(135deg, var(--primary), #166534);
      color: white;
      padding: 32px;
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(21, 163, 74, 0.2);
      position: relative;
      overflow: hidden;
    }

    .header::after {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 50%;
      top: -100px;
      right: -100px;
      pointer-events: none;
    }
    
    .header h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    
    .header p {
      margin: 8px 0 0 0;
      opacity: 0.9;
      font-size: 14px;
      line-height: 1.5;
    }
    
    .controls {
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    
    .stats {
      color: var(--text-muted);
      font-size: 13.5px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .actions {
      display: flex;
      gap: 8px;
    }
    
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
      font-family: var(--font);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    
    .btn-primary {
      background-color: var(--primary-light);
      color: var(--primary);
      border: 1px solid rgba(21, 163, 74, 0.15);
    }
    
    .btn-primary:hover {
      background-color: rgba(21, 163, 74, 0.15);
    }
    
    .btn-danger {
      background-color: rgba(239, 68, 68, 0.08);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.15);
    }
    
    .btn-danger:hover {
      background-color: rgba(239, 68, 68, 0.15);
    }
    
    .search-box {
      width: 240px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13.5px;
      font-family: var(--font);
      transition: all 0.2s ease;
      background-color: var(--input-bg);
      color: var(--text);
    }
    
    .search-box:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }
    
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    .history-item {
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 24px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    
    .history-item:hover {
      border-color: rgba(21, 163, 74, 0.25);
    }
    
    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    
    .item-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      margin: 0;
      flex: 1;
      margin-right: 15px;
      letter-spacing: -0.01em;
    }
    
    .item-date {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      font-weight: 500;
    }
    
    .history-stats {
      font-size: 12.5px;
      color: var(--green-dark, #0f8a3d);
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .item-urls {
      display: grid;
      grid-template-columns: 80px 1fr auto;
      gap: 12px;
      align-items: center;
      margin-bottom: 8px;
      background: #f8fafc;
      padding: 8px 12px;
      border-radius: 8px;
    }

    .item-urls:last-of-type {
      margin-bottom: 14px;
    }
    
    .url-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .url-link {
      color: var(--primary);
      text-decoration: none;
      word-break: break-all;
      font-size: 13.5px;
      font-weight: 500;
    }
    
    .url-link:hover {
      text-decoration: underline;
    }
    
    .copy-btn-small {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: var(--font);
    }
    
    .copy-btn-small:hover {
      background: var(--bg);
      border-color: var(--text-muted);
    }
    
    .copy-btn-small.copied {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    
    .action-buttons {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      border-top: 1px solid var(--border);
      padding-top: 14px;
    }
    
    .action-btn {
      background: var(--bg);
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: var(--font);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    
    .action-btn.edit:hover {
      background: #fef3c7;
      color: #b45309;
      border-color: #fde68a;
    }
    
    .action-btn.delete:hover {
      background: #fee2e2;
      color: #b91c1c;
      border-color: #fca5a5;
    }
    
    .edit-form {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-top: 14px;
      display: none;
    }
    
    .edit-form.show {
      display: block;
    }
    
    .edit-input {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      font-family: var(--font);
      box-sizing: border-box;
      background-color: var(--input-bg);
      color: var(--text);
    }

    .edit-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }
    
    .edit-buttons {
      display: flex;
      gap: 8px;
    }
    
    .edit-btn {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: var(--font);
    }
    
    .edit-btn.save {
      background: var(--primary);
      color: white;
    }
    
    .edit-btn.save:hover {
      background: var(--primary-hover);
    }
    
    .edit-btn.cancel {
      background: #e2e8f0;
      color: var(--text-muted);
    }
    
    .edit-btn.cancel:hover {
      background: #cbd5e1;
    }
    
    .empty-state {
      text-align: center;
      padding: 60px 24px;
      color: var(--text-muted);
      background: var(--card);
      border-radius: 20px;
      border: 1px dashed var(--border);
      box-shadow: var(--shadow);
    }
    
    .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .empty-state h3 {
      margin: 0 0 8px 0;
      color: var(--text);
      font-weight: 700;
      font-size: 18px;
    }

    .empty-state p {
      margin: 0;
      font-size: 14px;
    }
    
    .back-link {
      position: fixed;
      top: 24px;
      left: 24px;
      background: var(--card);
      color: var(--primary);
      padding: 10px 16px;
      border-radius: 8px;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
      border: 1px solid var(--border);
      font-weight: 600;
      font-size: 13px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 100;
    }
    
    .back-link:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(21, 163, 74, 0.2);
    }
    
    .hidden {
      display: none !important;
    }

    .tag-info {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11.5px;
      color: var(--text-muted);
      font-weight: 500;
      background: var(--bg);
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <a href="#" id="back-link" class="back-link">← <span data-i18n="backLink">Back to Extension</span></a>
  <button id="theme-toggle-btn" class="back-link" style="left: auto; right: 24px; display: flex; align-items: center; justify-content: center;" title="Toggle theme"></button>
  
  <div class="container">
    <div class="header">
      <h1>
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: white; vertical-align: middle; margin-right: 8px;"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
        <span data-i18n="historyTitleHeader">URL History</span>
      </h1>
      <p data-i18n="historySubtitle">Complete history of all your shortened URLs</p>
      <p style="font-size: 12px; opacity: 0.8; margin: 8px 0 0 0;" data-i18n="historyHint">💡 Press F5 or click "Refresh All" to reload new URLs and statistics</p>
    </div>
    
    <div class="controls">
      <div class="stats">
        <span id="total-count">0 URLs</span> • 
        <span id="storage-info">Loading...</span>
      </div>
      
      <input type="text" id="search-box" class="search-box" placeholder="Search URLs or titles..." data-i18n-placeholder="searchPlaceholder">
      
      <div class="actions">
        <button id="refresh-stats-btn" class="btn btn-primary" style="display: inline-flex; align-items: center; gap: 6px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path></svg>
          <span data-i18n="refreshBtn">Refresh All</span>
        </button>
        <button id="export-btn" class="btn btn-primary" style="display: inline-flex; align-items: center; gap: 6px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          <span data-i18n="exportBtn">Export</span>
        </button>
        <button id="clear-all-btn" class="btn btn-danger" style="display: inline-flex; align-items: center; gap: 6px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
          <span data-i18n="clearAllBtn">Clear All</span>
        </button>
      </div>
    </div>
    
    <div id="history-container" class="history-list">
      <!-- History items will be loaded here -->
    </div>
    
    <div id="empty-state" class="empty-state hidden">
      <div class="empty-icon">📝</div>
      <h3 data-i18n="emptyTitle">No URLs shortened yet</h3>
      <p data-i18n="emptyDesc">Start shortening URLs to see them appear here!</p>
    </div>
  </div>
  
  <script src="utils.js"></script>
  <script src="history.js"></script>
</body>
</html>
